<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <main class="container">
        <section class="card" role="region" aria-labelledby="admin-login-title">
            <div class="card-header">
                <h1 id="admin-login-title">Admin Portal</h1>
                <p class="subtitle">Sign in to access admin dashboard</p>
            </div>

            <form class="form" action="/admin/login" method="post" id="adminSigninForm" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <div class="checkbox-row" style="justify-content: space-between;">
                    <span>
                        <input id="remember" name="remember" type="checkbox">
                        <label for="remember">Remember me</label>
                    </span>
                    <a class="link" href="/forgot-password">Forgot password?</a>
                </div>

                <button class="button" type="submit">Sign in to Admin Portal</button>

                <p class="footnote">Need admin access? <a href="/admin/register" class="link">Register as admin</a></p>
            </form>
        </section>
    </main>

    <footer class="footer" aria-label="Footer">
        <p>© <span id="year"></span> Campuslink Admin</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
