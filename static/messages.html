<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusLink · Messages</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #121218;
      --border: rgba(148, 163, 184, 0.15);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: linear-gradient(180deg, rgba(15,23,42,0.98) 0%, rgba(15,23,42,0.95) 100%);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.1);
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
    }
    
    /* Main Layout */
    .main-container {
      margin-top: 56px;
      display: grid;
      grid-template-columns: 350px 1fr;
      height: calc(100vh - 56px);
    }
    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      .conversations-panel.hidden-mobile {
        display: none;
      }
      .chat-panel.hidden-mobile {
        display: none;
      }
      .chat-panel.mobile-open {
        display: flex;
      }
      .conversations-panel.mobile-hidden {
        display: none;
      }
      .header-title.mobile-chat {
        font-size: 16px;
      }
    }
    
    /* Conversations Panel */
    .conversations-panel {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--card);
    }
    .conversations-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 10;
    }
    .conversations-header h2 {
      font-size: 16px;
      font-weight: 700;
    }
    .conversation-list {
      list-style: none;
    }
    .conversation-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .conversation-item:hover {
      background: rgba(255,255,255,0.05);
    }
    .conversation-item.active {
      background: rgba(59, 130, 246, 0.15);
      border-left: 3px solid var(--accent);
    }
    .conversation-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: clip;
    }
    .conversation-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .conversation-info {
      flex: 1;
      min-width: 0;
    }
    .conversation-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .conversation-preview {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conversation-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .conversation-time {
      font-size: 11px;
      color: var(--muted);
    }
    .conversation-unread {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }
    .no-conversations {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .no-conversations-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    /* Chat Panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
    }
    .chat-header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      overflow: hidden;
      white-space: nowrap;
    }
    .chat-header-info h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .chat-header-info p {
      font-size: 12px;
      color: var(--muted);
    }
    .chat-header-actions {
      margin-left: auto;
    }
    .chat-header-actions a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .chat-header-actions a:hover {
      text-decoration: underline;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message.sent {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.received {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message-time {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
      text-align: right;
    }
    .message.received .message-time {
      color: var(--muted);
    }
    
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      padding: 40px;
    }
    .chat-empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .chat-empty h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text);
    }
    
    /* Chat Input */
    .chat-input-container {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--card);
    }
    .chat-input-form {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px 20px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    .chat-input:focus {
      border-color: var(--accent);
    }
    .chat-input::placeholder {
      color: var(--muted);
    }
    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.15s;
    }
    .send-btn:hover {
      background: var(--accent-hover);
    }
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="backBtn">←</button>
      <span class="header-title" id="headerTitle">Messages</span>
    </div>
  </header>

  <div class="main-container">
    <!-- Conversations List -->
    <div class="conversations-panel" id="conversationsPanel">
      <div class="conversations-header">
        <h2>Conversations</h2>
      </div>
      <ul class="conversation-list" id="conversationList">
        <li class="loading">Loading conversations...</li>
      </ul>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel hidden-mobile" id="chatPanel">
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty-icon">💬</div>
        <h3>Select a conversation</h3>
        <p>Choose a conversation from the left to start messaging</p>
      </div>
      
      <div id="chatContainer" style="display: none; height: 100%; display: flex; flex-direction: column;">
        <div class="chat-header" id="chatHeader">
          <div class="chat-header-avatar" id="chatAvatar">?</div>
          <div class="chat-header-info">
            <h3 id="chatName">Loading...</h3>
            <p id="chatHeadline"></p>
          </div>
          <div class="chat-header-actions" id="chatHeaderActions">
            <a href="#" id="viewProfileLink">View Profile</a>
          </div>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="chat-input-container">
          <form class="chat-input-form" id="messageForm">
            <input type="text" class="chat-input" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="send-btn" id="sendBtn">➤</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/cross-tab-auth.js"></script>
  <script>
    let currentUserId = null;
    let conversations = [];
    const token = localStorage.getItem("campuslink_token");

    if (!token) {
      window.location.href = "/login";
    }

    // Check URL for user_id parameter
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get("user");

    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("backBtn").onclick = () => {
        const isMobile = window.matchMedia("(max-width: 768px)").matches;
        if (isMobile && currentUserId) {
          showConversationListMobile();
          return;
        }
        const ref = document.referrer;
        if (ref && (ref.includes("/student") || ref.includes("/user/dashboard"))) window.history.back();
        else window.location.href = "/user/dashboard";
      };
      await loadConversations();
      if (targetUserId) {
        await openConversation(targetUserId);
      }
    });

    async function loadConversations() {
      const list = document.getElementById("conversationList");
      
      try {
        const res = await fetch("/api/messages/conversations", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        
        if (res.status === 401) {
          window.location.href = "/login";
          return;
        }
        
        const data = await res.json();
        conversations = data.conversations || [];
        
        if (!conversations.length) {
          list.innerHTML = `
            <li class="no-conversations">
              <div class="no-conversations-icon">🆘</div>
              <p>No conversations yet</p>
              <p style="font-size: 13px; margin-top: 8px;">Use Help to contact your department</p>
            </li>
          `;
          return;
        }
        
        list.innerHTML = conversations.map(conv => {
          const isHelp = conv.user_id === "help";
          const initials = isHelp ? "🆘" : getInitials(conv.name);
          const timeAgo = formatTimeAgo(conv.last_message_at);
          const unreadBadge = conv.unread_count > 0 
            ? `<span class="conversation-unread">${conv.unread_count}</span>` 
            : "";
          const hasPhoto = !isHelp && conv.profile_photo && conv.profile_photo.trim() !== '';
          
          return `
            <li class="conversation-item" data-user-id="${escapeHtml(conv.user_id)}" onclick="openConversation('${escapeHtml(conv.user_id).replace(/'/g, "\\'")}')">
              <div class="conversation-avatar">
                ${hasPhoto 
                  ? `<img src="${conv.profile_photo}" alt="${escapeHtml(conv.name)}">` 
                  : escapeHtml(initials)}
              </div>
              <div class="conversation-info">
                <div class="conversation-name">${escapeHtml(conv.name)}</div>
                <div class="conversation-preview">${escapeHtml(conv.last_message || "")}</div>
              </div>
              <div class="conversation-meta">
                <span class="conversation-time">${timeAgo}</span>
                ${unreadBadge}
              </div>
            </li>
          `;
        }).join("");
        
      } catch (e) {
        console.error("Failed to load conversations", e);
        list.innerHTML = `<li class="no-conversations"><p>Failed to load conversations</p></li>`;
      }
    }

    async function openConversation(userId) {
      currentUserId = userId;
      
      // Update UI
      document.getElementById("chatEmpty").style.display = "none";
      document.getElementById("chatContainer").style.display = "flex";
      
      // Update active state in list
      document.querySelectorAll(".conversation-item").forEach(item => {
        item.classList.toggle("active", item.dataset.userId === userId);
      });
      
      // Load messages
      await loadMessages(userId);
      if (window.matchMedia("(max-width: 768px)").matches) {
        showChatMobile();
      }
    }

    function showChatMobile() {
      const conv = document.getElementById("conversationsPanel");
      const chat = document.getElementById("chatPanel");
      const title = document.getElementById("headerTitle");
      conv.classList.add("mobile-hidden");
      chat.classList.add("mobile-open");
      if (title) title.classList.add("mobile-chat");
    }

    function showConversationListMobile() {
      const conv = document.getElementById("conversationsPanel");
      const chat = document.getElementById("chatPanel");
      const title = document.getElementById("headerTitle");
      conv.classList.remove("mobile-hidden");
      chat.classList.remove("mobile-open");
      if (title) title.classList.remove("mobile-chat");
      currentUserId = null;
    }

    async function loadMessages(userId) {
      const messagesContainer = document.getElementById("chatMessages");
      messagesContainer.innerHTML = '<div class="loading">Loading messages...</div>';
      const isHelp = userId === "help";
      try {
        const url = isHelp ? "/api/messages/help" : `/api/messages/${userId}`;
        const res = await fetch(url, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        
        if (!res.ok) {
          throw new Error("Failed to load messages");
        }
        
        const data = await res.json();
        const messages = data.messages || [];
        const otherUser = data.other_user || {};
        
        document.getElementById("chatName").textContent = otherUser.name || (isHelp ? "Help" : "User");
        document.getElementById("chatHeadline").textContent = otherUser.headline || "";
        document.getElementById("chatAvatar").textContent = isHelp ? "🆘" : getInitials(otherUser.name);
        const profileWrap = document.getElementById("chatHeaderActions");
        const viewLink = document.getElementById("viewProfileLink");
        if (isHelp) {
          viewLink.style.display = "none";
        } else {
          viewLink.style.display = "";
          viewLink.href = `/profile/${userId}`;
        }
        
        if (!messages.length) {
          messagesContainer.innerHTML = `
            <div style="text-align: center; color: var(--muted); padding: 20px;">
              <p>No messages yet. Say hello!</p>
            </div>
          `;
          return;
        }
        
        messagesContainer.innerHTML = messages.map(msg => {
          const isSent = msg.is_mine;
          const time = formatMessageTime(msg.created_at);
          
          return `
            <div class="message ${isSent ? 'sent' : 'received'}">
              <div class="message-content">${escapeHtml(msg.content)}</div>
              <div class="message-time">${time}</div>
            </div>
          `;
        }).join("");
        
        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        // Refresh conversation list to update unread counts
        loadConversations();
        
      } catch (e) {
        console.error("Failed to load messages", e);
        messagesContainer.innerHTML = `<div class="loading">Failed to load messages</div>`;
      }
    }

    // Send message
    document.getElementById("messageForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const input = document.getElementById("messageInput");
      const content = input.value.trim();
      
      if (!content || !currentUserId) return;
      
      const sendBtn = document.getElementById("sendBtn");
      sendBtn.disabled = true;
      
      try {
        const isHelp = currentUserId === "help";
        const url = isHelp ? "/api/messages/help" : `/api/messages/${currentUserId}`;
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ content })
        });
        
        if (!res.ok) {
          throw new Error("Failed to send message");
        }
        
        input.value = "";
        await loadMessages(currentUserId);
        
      } catch (e) {
        console.error("Failed to send message", e);
        alert("Failed to send message");
      } finally {
        sendBtn.disabled = false;
      }
    });

    // Utilities
    function getInitials(name) {
      if (!name || typeof name !== 'string') return "?";
      const parts = name.trim().split(/\s+/).filter(p => p.length > 0);
      if (parts.length === 0) return "?";
      if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseUTCDate(dateStr) {
      if (!dateStr) return null;
      // Ensure UTC interpretation - add Z if not present
      let utcStr = dateStr;
      if (!dateStr.endsWith('Z') && !dateStr.includes('+') && !dateStr.includes('-', 10)) {
        utcStr = dateStr + 'Z';
      }
      return new Date(utcStr);
    }

    function formatTimeAgo(dateStr) {
      const date = parseUTCDate(dateStr);
      if (!date) return "";
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      
      if (diffMins < 0) return "now";
      if (diffMins < 1) return "now";
      if (diffMins < 60) return `${diffMins}m`;
      if (diffHours < 24) return `${diffHours}h`;
      if (diffDays < 7) return `${diffDays}d`;
      return date.toLocaleDateString();
    }

    function formatMessageTime(dateStr) {
      const date = parseUTCDate(dateStr);
      if (!date) return "";
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
