<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <main class="container">
        <section class="card" role="region" aria-labelledby="admin-register-title">
            <div class="card-header">
                <h1 id="admin-register-title">Admin Registration</h1>
                <p class="subtitle">Create admin account for Campuslink</p>
            </div>

            <form class="form" action="/admin/register" method="post" id="adminSignupForm" novalidate>
                <div class="grid">
                    <div class="field">
                        <label for="firstName">First name</label>
                        <input id="firstName" name="first_name" type="text" autocomplete="given-name" required>
                    </div>
                    <div class="field">
                        <label for="lastName">Last name</label>
                        <input id="lastName" name="last_name" type="text" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">Admin Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
                </div>

                <div class="grid">
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                        <small class="hint">Use at least 8 characters</small>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm password</label>
                        <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
                </div>

                <button class="button" type="submit">Create Admin Account</button>

                <p class="footnote">Already have an admin account? <a href="/admin/login" class="link">Sign in</a></p>
            </form>
        </section>
    </main>

    <footer class="footer" aria-label="Footer">
        <p>© <span id="year"></span> Campuslink Admin</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const form = document.getElementById('adminSignupForm');
        form.addEventListener('submit', function (e) {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) {
                e.preventDefault();
                alert('Passwords do not match.');
            }
        });
    </script>
</body>
</html>
