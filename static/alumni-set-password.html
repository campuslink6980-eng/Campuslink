<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your password – CampusLink Alumni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo-placeholder" aria-label="CampusLink logo area">
                    <a href="/main"><img class="logo-img" src="/images/logo.png" alt="CampusLink logo"></a>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="card" role="region" aria-labelledby="setup-title">
            <div class="card-header">
                <h1 id="setup-title">Create your password</h1>
                <p class="subtitle">Your alumni request has been approved. Choose a strong password (8+ characters, upper, lower, number, symbol).</p>
            </div>

            <form class="form" id="setupForm" novalidate>
                <div class="field">
                    <label for="new_password">New password</label>
                    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="field">
                    <label for="confirm_password">Confirm password</label>
                    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
                </div>

                <button class="button" type="submit" id="submitBtn">Create password</button>

                <p class="footnote"><a href="/login" class="link">Back to sign in</a></p>
            </form>

            <p id="message" class="footnote" style="margin-top:12px; display:none;"></p>
        </section>
    </main>

    <footer class="footer" aria-label="Footer">
        <p>© <span id="year"></span> CampusLink</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        var pathParts = window.location.pathname.split('/').filter(Boolean);
        var token = (pathParts[pathParts.length - 1] && pathParts.indexOf('set-password') !== -1) ? pathParts[pathParts.length - 1] : '';

        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var newPassword = document.getElementById('new_password').value;
            var confirmPassword = document.getElementById('confirm_password').value;
            var messageEl = document.getElementById('message');
            var submitBtn = document.getElementById('submitBtn');

            messageEl.style.display = 'none';
            messageEl.textContent = '';

            if (newPassword !== confirmPassword) {
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--danger, #ef4444)';
                messageEl.textContent = 'Passwords do not match.';
                return;
            }

            if (!token) {
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--danger, #ef4444)';
                messageEl.textContent = 'Invalid link. Please contact your coordinator.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating…';

            try {
                var res = await fetch('/alumni/set-password/' + encodeURIComponent(token), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password: newPassword })
                });
                var data = await res.json().catch(function() { return {}; });
                messageEl.style.display = 'block';
                if (res.ok) {
                    messageEl.style.color = 'var(--success, #10b981)';
                    messageEl.textContent = 'Password set. Redirecting to sign in…';
                    setTimeout(function() { window.location.href = '/login'; }, 1500);
                } else {
                    messageEl.style.color = 'var(--danger, #ef4444)';
                    messageEl.textContent = data.error || 'Failed. Please try again or contact your coordinator.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create password';
                }
            } catch (err) {
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--danger, #ef4444)';
                messageEl.textContent = 'Network error. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create password';
            }
        });
    </script>
</body>
</html>
