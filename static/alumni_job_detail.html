<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusLink · Alumni job</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/job-deadline.css" />
  <style>
    body {
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 800px at 80% -10%, #1d2a5c 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 40%, #0b63c5 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 26px 18px 60px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)), #0f172a;
      border-radius:22px;
      border:1px solid rgba(148,163,184,0.55);
      padding:18px 20px 16px;
      box-shadow: 0 30px 80px rgba(15,23,42,0.8), 0 0 0 1px rgba(15,23,42,0.7);
      color:#e5e7eb;
    }
    h1 { margin:0; font-size: 20px; }
    .meta { margin-top:6px; font-size:12px; color: #9ca3af; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .pill { display:inline-flex; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; background: rgba(79,70,229,0.2); color: #e5e7eb; }
    .pill.alumni-src { background: rgba(16, 185, 129, 0.25); color: #a7f3d0; }
    .btn {
      border:1px solid rgba(148,163,184,0.7);
      background: transparent;
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      color:#e5e7eb;
    }
    .btn.primary {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border:none;
      color:#fff;
      box-shadow:0 12px 30px rgba(59,130,246,0.45);
    }
    .btn[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow:none; }
    .apply-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .reasons { margin-top: 10px; font-size: 13px; color: #fed7aa; }
    .desc { margin-top: 12px; font-size: 13px; line-height: 1.6; color: #e5e7eb; white-space: pre-wrap; }
    .state { padding:12px; color: #9ca3af; font-size: 13px; }
    .job-important-criteria {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      background: linear-gradient(135deg, rgba(254, 243, 199, 0.14), rgba(252, 165, 165, 0.12));
    }
    .job-important-criteria h2 { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: #fde68a; }
    .job-important-criteria p { margin: 0; font-size: 13px; line-height: 1.55; color: #fef3c7; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <div>
          <h1 id="title">Loading…</h1>
          <div class="meta" id="meta"></div>
        </div>
        <div class="apply-actions">
          <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
            <button class="btn" type="button" onclick="window.location.href='/jobs'">Back to jobs</button>
            <button class="btn primary" id="applyBtn" type="button" disabled>Apply</button>
          </div>
          <p id="applyDeadlineNote" class="job-deadline-note" style="display:none; text-align:right; margin:0;"></p>
        </div>
      </div>
      <div id="deadlineCountdown" class="job-deadline-countdown" style="margin-top:4px;" aria-live="polite"></div>
      <div id="importantCriteria" class="job-important-criteria" style="display:none;" role="note"></div>
      <div id="reasons" class="reasons" style="display:none;"></div>
      <div id="desc" class="desc"></div>
      <div id="req" class="desc" style="margin-top:8px;"></div>
      <div id="salary" class="desc" style="margin-top:8px;"></div>
      <div id="attachment" class="desc" style="margin-top:8px;"></div>
      <div id="state" class="state"></div>
    </div>
  </div>

  <script src="/static/js/job-deadline-ui.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll("\"","&quot;").replaceAll("'","&#039;");
    }

    function jobIdFromPath() {
      var parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1] || "";
    }

    async function load() {
      var id = jobIdFromPath();
      var title = document.getElementById("title");
      var meta = document.getElementById("meta");
      var desc = document.getElementById("desc");
      var req = document.getElementById("req");
      var state = document.getElementById("state");
      var salaryEl = document.getElementById("salary");
      var attachmentEl = document.getElementById("attachment");
      var applyBtn = document.getElementById("applyBtn");
      var reasonsEl = document.getElementById("reasons");
      var importantCriteriaEl = document.getElementById("importantCriteria");
      var deadlineNote = document.getElementById("applyDeadlineNote");
      var cdEl = document.getElementById("deadlineCountdown");

      state.textContent = "Loading job…";
      try {
        var res = await fetch("/api/student/alumni-jobs/" + encodeURIComponent(id), { credentials: "same-origin" });
        if (res.status === 401) { window.location.href = "/login"; return; }
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || "Failed to load job");

        var j = data.job || {};
        var apply = data.apply || {};

        title.textContent = (j.role || "Role") + " · " + (j.company_name || "Company");
        var loc = j.location ? "Location: " + j.location : "";
        var poster = j.posted_by_name ? "<span>Posted by alumni: " + escapeHtml(j.posted_by_name) + "</span>" : "";
        meta.innerHTML =
          "<span class=\"pill alumni-src\">Alumni post</span>" +
          "<span class=\"pill\">" + escapeHtml(j.type || "") + "</span>" +
          "<span class=\"pill\">" + escapeHtml(j.mode || "") + "</span>" +
          (loc ? "<span>" + escapeHtml(loc) + "</span>" : "") +
          poster +
          "<span>Application deadline: " + escapeHtml(j.deadline || j.application_deadline || "—") + "</span>" +
          "<span>Eligible branches: " + escapeHtml((j.eligible_branches || []).join(", ") || "—") + "</span>";

        var icText = (j.important_criteria_text && String(j.important_criteria_text).trim()) || "";
        if (j.important_criteria_enabled && icText) {
          importantCriteriaEl.style.display = "block";
          importantCriteriaEl.innerHTML =
            "<h2>Important criteria</h2><p>" + escapeHtml(icText).replace(/\n/g, "<br>") + "</p>";
        } else {
          importantCriteriaEl.style.display = "none";
          importantCriteriaEl.innerHTML = "";
        }

        var descHtml = "";
        if (j.about) descHtml += escapeHtml(j.about).replace(/\n/g, "<br>");
        if (j.responsibilities && j.responsibilities.length) {
          descHtml += (descHtml ? "<br><br>" : "") + "<strong>Key responsibilities</strong><br>" +
            j.responsibilities.map(function (r) { return "• " + escapeHtml(r); }).join("<br>");
        }
        if (!descHtml && j.description) descHtml = escapeHtml(j.description).replace(/\n/g, "<br>");
        desc.innerHTML = descHtml || "No description provided.";

        var reqParts = [];
        if (j.required_skills && j.required_skills.length) {
          reqParts.push("Required skills: " + j.required_skills.map(escapeHtml).join(", "));
        }
        if (j.preferred_skills && j.preferred_skills.length) {
          reqParts.push("Preferred skills: " + j.preferred_skills.map(escapeHtml).join(", "));
        }
        if (j.requirements) reqParts.push(escapeHtml(j.requirements));
        req.innerHTML = reqParts.length ? reqParts.join("<br><br>") : "";

        var salaryParts = [];
        if (j.salary) salaryParts.push("Salary / stipend: " + escapeHtml(j.salary));
        if (j.perks && j.perks.length) salaryParts.push("Perks: " + j.perks.map(escapeHtml).join(", "));
        if (j.selection_process) salaryParts.push("Selection: " + escapeHtml(j.selection_process));
        if (j.rounds && j.rounds.length) salaryParts.push("Rounds: " + j.rounds.map(escapeHtml).join(" → "));
        if (j.joining_date) salaryParts.push("Expected joining: " + escapeHtml(j.joining_date));
        salaryEl.innerHTML = salaryParts.length ? salaryParts.join("<br>") : "";

        var multi = j.attachments || [];
        if (multi.length) {
          attachmentEl.innerHTML = multi.map(function (a, i) {
            var fn = a.filename || "Document " + (i + 1);
            return "<div style=\"margin-top:4px;\"><a href=\"/alumni-jobs/" + encodeURIComponent(id) + "/attachment?n=" + i + "\" class=\"link\" style=\"font-size:13px;color:#93c5fd;\">Download " + escapeHtml(fn) + "</a></div>";
          }).join("");
        } else {
          attachmentEl.textContent = "";
        }

        var CL = window.CampusLinkJobDeadline;
        var deadlinePassed = !!(apply.deadline_passed || (CL && CL.isDeadlinePassed(j)));

        function sealClosed() {
          if (apply.already_applied) return;
          applyBtn.disabled = true;
          applyBtn.textContent = "Applications closed";
          if (deadlineNote) {
            deadlineNote.textContent = "Application deadline has passed";
            deadlineNote.style.display = "block";
          }
        }

        applyBtn.onclick = null;
        applyBtn.classList.remove("apply-closed");
        if (deadlineNote) { deadlineNote.style.display = "none"; deadlineNote.textContent = ""; }

        if (CL && cdEl && !apply.already_applied) {
          if (deadlinePassed) {
            cdEl.textContent = "Applications closed";
            cdEl.className = "job-deadline-countdown cl-cd-ended";
          } else {
            cdEl.className = "job-deadline-countdown";
            CL.renderCountdown(cdEl, j, { onClosed: sealClosed });
          }
        }

        if (apply.already_applied) {
          applyBtn.disabled = true;
          applyBtn.textContent = "Applied" + (apply.application_status ? " (" + apply.application_status + ")" : "");
          reasonsEl.style.display = "none";
        } else if (deadlinePassed) {
          sealClosed();
          reasonsEl.style.display = "block";
          reasonsEl.innerHTML = "<div class=\"job-deadline-note\">Application deadline has passed</div>";
        } else if (apply.can_apply) {
          applyBtn.disabled = false;
          applyBtn.textContent = "Apply now";
          reasonsEl.style.display = "none";
          applyBtn.onclick = async function () {
            applyBtn.disabled = true;
            applyBtn.textContent = "Submitting…";
            try {
              var r = await fetch("/api/student/alumni-job-apply", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ job_id: id }),
              });
              var d = await r.json().catch(function () { return {}; });
              if (!r.ok) throw new Error(d.error || "Apply failed");
              applyBtn.textContent = "Applied";
            } catch (err) {
              alert(err && err.message ? err.message : "Apply failed");
              applyBtn.disabled = false;
              applyBtn.textContent = "Apply now";
            }
          };
        } else {
          applyBtn.disabled = true;
          applyBtn.textContent = "Sign in as a student to apply";
          reasonsEl.style.display = "none";
        }

        state.textContent = "";
      } catch (e) {
        state.textContent = e.message || "Failed to load job";
      }
    }

    document.addEventListener("DOMContentLoaded", load);
  </script>
</body>
</html>
