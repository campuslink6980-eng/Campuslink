<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo-placeholder" aria-label="Campuslink logo area">
                    <a href="/"><img class="logo-img" src="/images/logo.png" alt="Campuslink logo"></a>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="card" role="region" aria-labelledby="reset-title">
            <div class="card-header">
                <h1 id="reset-title">Set new password</h1>
                <p class="subtitle">Choose a strong password (8+ characters, upper, lower, number, symbol).</p>
            </div>

            <form class="form" id="resetForm" novalidate>
                <div class="field">
                    <label for="new_password">New password</label>
                    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="field">
                    <label for="confirm_password">Confirm new password</label>
                    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
                </div>

                <button class="button" type="submit" id="submitBtn">Update password</button>

                <p class="footnote"><a href="/login" class="link">Back to sign in</a></p>
            </form>

            <p id="message" class="footnote" style="margin-top:12px; display:none;"></p>
        </section>
    </main>

    <footer class="footer" aria-label="Footer">
        <p>© <span id="year"></span> Campuslink</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Token is in the URL: /reset-password/<token>
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const token = pathParts[1] || '';

        const form = document.getElementById('resetForm');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            messageEl.style.display = 'none';
            messageEl.textContent = '';

            if (newPassword !== confirmPassword) {
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--danger, #ef4444)';
                messageEl.textContent = 'Passwords do not match.';
                return;
            }

            if (!token) {
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--danger, #ef4444)';
                messageEl.textContent = 'Invalid reset link. Please request a new one.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating…';

            try {
                const res = await fetch('/reset-password/' + encodeURIComponent(token), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password: newPassword })
                });
                const data = await res.json().catch(() => ({}));
                messageEl.style.display = 'block';
                if (res.ok) {
                    messageEl.style.color = 'var(--success, #10b981)';
                    messageEl.textContent = 'Password updated. Redirecting to sign in…';
                    setTimeout(function() {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    messageEl.style.color = 'var(--danger, #ef4444)';
                    messageEl.textContent = data.error || 'Failed to update password. Try again or request a new link.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update password';
                }
            } catch (err) {
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--danger, #ef4444)';
                messageEl.textContent = 'Network error. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update password';
            }
        });
    </script>
</body>
</html>
