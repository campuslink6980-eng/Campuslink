<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interviews · CampusLink</title>
  <style>
    :root { --bg: #f3f2ef; --paper: #fff; --text: #1d2226; --muted: #6b7280; --line: #e5e7eb; --brand: #0a66c2; --danger: #dc2626; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
    .title { margin: 0; font-size: 22px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    .btn { border: 1px solid var(--line); background: var(--paper); color: var(--text); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .shell { max-width: 1120px; margin: 0 auto; padding: 22px 18px 30px; }
    .state { text-align: center; color: var(--muted); padding: 40px 0; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06); transition: transform 0.18s ease, box-shadow 0.18s ease; text-decoration: none; color: inherit; display: block; position: relative; }
    .card:hover { transform: scale(1.01); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1); }
    .company { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
    .role { margin: 0; color: var(--muted); font-size: 15px; }
    .delete-btn { margin-top: 12px; border: none; background: transparent; color: var(--danger); font-weight: 600; cursor: pointer; padding: 0; }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 768px) {
      .topbar { padding: 14px 12px; }
      .title { font-size: 19px; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; text-align: center; }
      .shell { padding: 16px 12px 24px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="title">Interview Drives</h1>
    <div class="actions">
      <button class="btn" id="back-btn" type="button">← Back</button>
      <a href="/coordinator/post-interview" id="add-btn" class="btn primary" style="display:none;">Add Interview</a>
    </div>
  </header>
  <main class="shell">
    <div id="loading" class="state">Loading interviews...</div>
    <div id="error" class="state" style="display:none;"></div>
    <div id="grid" class="grid" style="display:none;"></div>
  </main>
  <script src="/static/js/cross-tab-auth.js"></script>
  <script>
    (function() {
      function el(id) { return document.getElementById(id); }
      function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

      el("back-btn").addEventListener("click", function() {
        if (window.history.length > 1) window.history.back();
        else window.close();
      });

      function removeDrive(driveId) {
        if (!window.confirm("Delete this interview drive? This will also remove related feedback.")) return;
        fetch("/api/coordinator/interview-drives/" + encodeURIComponent(driveId), {
          method: "DELETE",
          credentials: "same-origin"
        })
          .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
          .then(function(res) {
            if (res.status === 200) window.location.reload();
            else alert(res.data.error || "Failed to delete.");
          })
          .catch(function() { alert("Failed to delete."); });
      }

      fetch("/api/interview/drives", { credentials: "same-origin" })
        .then(function(r) {
          if (r.status === 401) { window.location.href = "/login"; return null; }
          return r.json();
        })
        .then(function(data) {
          el("loading").style.display = "none";
          if (!data || data.error) {
            el("error").textContent = (data && data.error) ? data.error : "Unable to load interviews.";
            el("error").style.display = "block";
            return;
          }
          if (data.is_coordinator) el("add-btn").style.display = "inline-block";
          var drives = data.drives || [];
          if (!drives.length) {
            el("error").textContent = "No interview drives available.";
            el("error").style.display = "block";
            return;
          }
          el("grid").innerHTML = drives.map(function(d) {
            return "<a class=\"card\" href=\"/interview-drive/" + encodeURIComponent(d.id) + "\"><p class=\"company\">" + esc(d.company || "Company") + "</p><p class=\"role\">" + esc(d.role || "Role") + "</p>" + (d.can_delete ? "<button class=\"delete-btn\" type=\"button\" data-id=\"" + esc(d.id) + "\">Delete</button>" : "") + "</a>";
          }).join("");
          el("grid").querySelectorAll(".delete-btn").forEach(function(btn) {
            btn.addEventListener("click", function(e) {
              e.preventDefault();
              e.stopPropagation();
              removeDrive(btn.getAttribute("data-id"));
            });
          });
          el("grid").style.display = "grid";
        })
        .catch(function() {
          el("loading").style.display = "none";
          el("error").textContent = "Unable to load interviews.";
          el("error").style.display = "block";
        });
    })();
  </script>
</body>
</html>
