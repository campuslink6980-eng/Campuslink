<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo-placeholder" aria-label="Campuslink logo area">
                    <a href="/"><img class="logo-img" src="/images/logo.png" alt="Campuslink logo"></a>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="card" role="region" aria-labelledby="forgot-title">
            <div class="card-header">
                <h1 id="forgot-title">Forgot password?</h1>
                <p class="subtitle">Enter the email you used to register. We’ll send you a link to reset your password.</p>
            </div>

            <form class="form" id="forgotForm" novalidate>
                <div class="field">
                    <label for="email">Registered email</label>
                    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
                </div>

                <button class="button" type="submit" id="submitBtn">Send reset link</button>

                <p class="footnote"><a href="/login" class="link">Back to sign in</a></p>
            </form>

            <p id="message" class="footnote" style="margin-top:12px; display:none;"></p>
        </section>
    </main>

    <footer class="footer" aria-label="Footer">
        <p>© <span id="year"></span> Campuslink</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const form = document.getElementById('forgotForm');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return;

            messageEl.style.display = 'none';
            messageEl.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending…';

            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json().catch(() => ({}));
                messageEl.style.display = 'block';
                if (res.ok) {
                    messageEl.style.color = 'var(--success, #10b981)';
                    messageEl.textContent = 'If this email is registered, a reset link has been sent. Check your inbox and spam folder.';
                } else {
                    messageEl.style.color = 'var(--danger, #ef4444)';
                    messageEl.textContent = data.error || 'Something went wrong. Try again.';
                }
            } catch (err) {
                messageEl.style.display = 'block';
                messageEl.style.color = 'var(--danger, #ef4444)';
                messageEl.textContent = 'Network error. Please try again.';
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send reset link';
        });
    </script>
</body>
</html>
